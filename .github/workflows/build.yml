name: build

# Uses ONLY first-party actions/* pinned by SHA + shell, so it runs
# even if the org restricts third-party GitHub Actions. Rust is preinstalled
# on the ubuntu runner image.
on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main]
  workflow_dispatch:

# No secrets here: this only proves the bundle still builds, including for
# pull requests from forks.
permissions:
  contents: read

jobs:
  tauri-linux:
    name: Build (Tauri · Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            pkg-config \
            patchelf \
            file wget curl

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Rust toolchain info
        run: rustup show && cargo --version

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend (static export)
        run: npm run next-build

      - name: Check Rust backend
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      # cargo check only compiles the test targets; nothing was asserting.
      - name: Test Rust backend
        working-directory: src-tauri
        run: cargo test --locked

      # No updater artifacts here: signing them needs the private key, which a
      # pull request from a fork cannot see. Signed builds are the release
      # workflows' job — this one only has to prove the bundle still builds.
      - name: Build Tauri bundle
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orquesta-terminal-linux
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: warn
          retention-days: 7
